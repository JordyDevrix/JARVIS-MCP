services:
  jarvis:
    image: ghcr.io/jordydevrix/jarvis-mcp:${JARVIS_VERSION:-latest}
    container_name: jarvis
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/development/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
