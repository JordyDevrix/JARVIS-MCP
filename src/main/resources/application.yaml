spring:
  application:
    name: JARVIS
  ai:
    mcp:
      server:
        name: JARVIS
        version: 0.0.1
        protocol: STREAMABLE

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs.enabled: true
  swagger-ui:
    enabled: true
    path: /docs

flightradar24:
  api-token: ${FR24_API_TOKEN:${FLIGHTRADAR24_API_KEY:}}
  base-url: ${FR24_BASE_URL:https://fr24api.flightradar24.com}
  connect-timeout-seconds: 3
  read-timeout-seconds: 5

ovapi:
  base-url: ${OVAPI_BASE_URL:http://v0.ovapi.nl}
  gtfs-base-url: ${OVAPI_GTFS_URL:https://gtfs.ovapi.nl/nl}
  connect-timeout-seconds: 5
  read-timeout-seconds: 10
  vehicle-cache-ttl-seconds: 15
  stop-cache-ttl-hours: 24

location:
  nominatim-base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  ip-geolocation-base-url: ${IP_GEOLOCATION_BASE_URL:http://ip-api.com/json}
  connect-timeout-seconds: 5
  read-timeout-seconds: 10
  cache-ttl-minutes: 60

mcptools:
  enabled:
    get_current_time: true
    get_current_location: true
    reverse_geocode: true
    geocode_address: true
    find_nearby_places: true
    lookup_location: true
    get_nearby_flights: false
    get_flight_details: false
    get_airport_flights: false
    get_airport_details: false
    get_live_ov_locations: true
    get_ov_stop_departures: true
    search_ov_stops: true
