name: Release

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Create version & release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.version_tag }}
      new_version: ${{ steps.tag_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests before release
        run: ./mvnw test

      - name: Determine Next Semantic Version
        id: tag_version
        uses: PaulHatch/semantic-version@v6
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)|(BREAKING)"
          minor_pattern: "(feat|feature)"
          version_format: "${major}.${minor}.${patch}"

      - name: Push Git Tag
        run: |
          git tag "${{ steps.tag_version.outputs.version_tag }}"
          git push origin "${{ steps.tag_version.outputs.version_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag_version.outputs.version_tag }}" \
            --title "Release ${{ steps.tag_version.outputs.version_tag }}" \
            --generate-notes
